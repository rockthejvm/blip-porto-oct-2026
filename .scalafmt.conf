# Three people editing the same files for five hours will otherwise generate
# formatting conflicts that cost real time. One config file prevents all of them.
version = 3.8.3
runner.dialect = scala3
maxColumn = 120
align.preset = none
docstrings.style = SpaceAsterisk
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
rewrite.redundantBraces.stringInterpolation = true
